name: Windows release build

on:
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure git
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Install ATL component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          Start-Process -FilePath $installer -ArgumentList @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--passive",
            "--norestart",
            "--wait"
          ) -Wait -NoNewWindow

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare dependencies
        shell: cmd
        run: |
          Telegram\build\prepare\win.bat

      - name: Configure
        shell: cmd
        run: |
          cd Telegram
          configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Release
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram --parallel

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out\Release\* -DestinationPath dist\AyuGram-6.9.3-windows-x64-portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-6.9.3-windows-x64-portable
          path: dist/AyuGram-6.9.3-windows-x64-portable.zip
          if-no-files-found: error
